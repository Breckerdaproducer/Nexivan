<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70" fill="none">
  <defs>
    <linearGradient id="nexGradW1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="nexGradW2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="nexGradW3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glowW" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Modern Geometric 'N' & Logistics Cube Icon -->
  <g transform="translate(6, 6)" filter="url(#glowW)">
    <!-- Left Pillar -->
    <path d="M6 52 L6 14 L20 6 L20 44 Z" fill="url(#nexGradW1)"/>
    <!-- Diagonal Dynamic Wing / Ribbon -->
    <path d="M20 6 L44 38 L44 54 L20 22 Z" fill="url(#nexGradW3)"/>
    <!-- Right Pillar -->
    <path d="M44 22 L44 54 L58 46 L58 8 Z" fill="url(#nexGradW2)"/>
    <!-- Speed/Forward Accent Dart -->
    <path d="M25 25 L38 35 L28 35 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Typography (White & Sky Blue for Dark Surfaces) -->
  <text x="78" y="38" font-family="'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="30" letter-spacing="1.5" fill="#ffffff">NEXIVAN</text>
  <text x="80" y="54" font-family="'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="11.5" letter-spacing="6" fill="#38bdf8">LOGISTICS</text>
</svg>
