<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 50" width="60" height="50">
  <defs>
    <filter id="boxShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>

    <!-- Kraft Top Face -->
    <linearGradient id="kraftTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Kraft Left Front Face -->
    <linearGradient id="kraftLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Kraft Right Front Face -->
    <linearGradient id="kraftRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Tape Gradient -->
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>

  <g filter="url(#boxShadow)">
    <!-- 3D Isometric Cube Faces -->
    <!-- Top Face -->
    <polygon points="30,4 52,15 30,26 8,15" fill="url(#kraftTop)" stroke="#d97706" stroke-width="0.8"/>

    <!-- Left Face -->
    <polygon points="8,15 30,26 30,44 8,33" fill="url(#kraftLeft)" stroke="#b45309" stroke-width="0.8"/>

    <!-- Right Face -->
    <polygon points="30,26 52,15 52,33 30,44" fill="url(#kraftRight)" stroke="#78350f" stroke-width="0.8"/>

    <!-- Packaging Tape Seams -->
    <!-- Top tape line -->
    <polygon points="19,9.5 41,20.5 43,19.5 21,8.5" fill="url(#tapeGrad)" stroke="#ca8a04" stroke-width="0.3"/>
    <!-- Left face tape line -->
    <polygon points="17,19.5 17,37.5 20,39 20,21" fill="url(#tapeGrad)" opacity="0.9"/>
    <!-- Right face tape line -->
    <polygon points="41,20.5 41,38.5 38,40 38,22" fill="url(#tapeGrad)" opacity="0.9"/>

    <!-- Fragile / Shipping Barcode Label on Left Face -->
    <polygon points="11,21 24,27.5 24,33 11,26.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
    <!-- Barcode lines -->
    <line x1="13" y1="23.5" x2="13" y2="27.5" stroke="#0f172a" stroke-width="0.7"/>
    <line x1="15" y1="24.5" x2="15" y2="28.5" stroke="#0f172a" stroke-width="0.5"/>
    <line x1="17" y1="25.5" x2="17" y2="29.5" stroke="#0f172a" stroke-width="0.9"/>
    <line x1="19" y1="26.5" x2="19" y2="30.5" stroke="#0f172a" stroke-width="0.6"/>
    <line x1="21" y1="27.5" x2="21" y2="31.5" stroke="#0f172a" stroke-width="0.8"/>

    <!-- "THIS SIDE UP" arrows on Right Face -->
    <polygon points="43,26 45,24 47,26 45.8,26 45.8,29 44.2,29 44.2,26" fill="#0f172a"/>
  </g>
</svg>
