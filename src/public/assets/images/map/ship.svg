<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 80" width="140" height="80">
  <defs>
    <filter id="shipShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>

    <linearGradient id="hullDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="waterLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <g filter="url(#shipShadow)">
    <!-- Water surface wake -->
    <path d="M 6 62 C 30 60 70 64 134 62" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 16 65 C 40 63 80 66 126 65" stroke="#bae6fd" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Red Keel / Waterline Hull -->
    <path d="M 18 56 L 24 62 L 120 62 L 126 56 Z" fill="url(#waterLine)"/>

    <!-- Main Black / Slate Steel Hull -->
    <path d="M 12 40 L 18 56 L 126 56 L 132 40 L 126 40 Z" fill="url(#hullDark)" stroke="#334155" stroke-width="0.8"/>
    <!-- Hull White Top Rim -->
    <line x1="12" y1="40" x2="132" y2="40" stroke="#f8fafc" stroke-width="1.5"/>

    <!-- STACKS OF SHIPPING CONTAINERS -->
    <!-- Tier 1 Containers -->
    <rect x="24" y="32" width="16" height="8" fill="#0284c7" stroke="#0369a1" stroke-width="0.6"/>
    <rect x="42" y="32" width="16" height="8" fill="#f59e0b" stroke="#d97706" stroke-width="0.6"/>
    <rect x="60" y="32" width="16" height="8" fill="#10b981" stroke="#059669" stroke-width="0.6"/>
    <rect x="78" y="32" width="16" height="8" fill="#ef4444" stroke="#b91c1c" stroke-width="0.6"/>
    <rect x="96" y="32" width="16" height="8" fill="#06b6d4" stroke="#0891b2" stroke-width="0.6"/>

    <!-- Tier 2 Containers -->
    <rect x="26" y="24" width="16" height="8" fill="#ea580c" stroke="#c2410c" stroke-width="0.6"/>
    <rect x="44" y="24" width="16" height="8" fill="#0284c7" stroke="#0369a1" stroke-width="0.6"/>
    <rect x="62" y="24" width="16" height="8" fill="#f59e0b" stroke="#d97706" stroke-width="0.6"/>
    <rect x="80" y="24" width="16" height="8" fill="#10b981" stroke="#059669" stroke-width="0.6"/>

    <!-- Tier 3 Containers (Top Center Stacks) -->
    <rect x="46" y="16" width="16" height="8" fill="#06b6d4" stroke="#0891b2" stroke-width="0.6"/>
    <rect x="64" y="16" width="16" height="8" fill="#ef4444" stroke="#b91c1c" stroke-width="0.6"/>

    <!-- Corrugation marks on containers -->
    <line x1="32" y1="33" x2="32" y2="39" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
    <line x1="50" y1="33" x2="50" y2="39" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
    <line x1="68" y1="33" x2="68" y2="39" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
    <line x1="86" y1="33" x2="86" y2="39" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
    <line x1="104" y1="33" x2="104" y2="39" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>

    <!-- Aft Bridge Superstructure -->
    <rect x="114" y="20" width="14" height="20" fill="url(#bridgeGrad)" stroke="#94a3b8" stroke-width="0.7"/>
    <!-- Bridge Windows -->
    <rect x="115" y="22" width="12" height="3" fill="#0f172a"/>
    <line x1="117" y1="22" x2="117" y2="25" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="121" y1="22" x2="121" y2="25" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="125" y1="22" x2="125" y2="25" stroke="#ffffff" stroke-width="0.5"/>

    <!-- Smokestack / Funnel -->
    <rect x="119" y="10" width="5" height="10" fill="#0284c7" stroke="#0369a1" stroke-width="0.7"/>
    <rect x="119" y="10" width="5" height="2.5" fill="#0f172a"/>

    <!-- Radar Mast -->
    <line x1="121" y1="10" x2="121" y2="4" stroke="#475569" stroke-width="1"/>
    <line x1="118" y1="6" x2="124" y2="6" stroke="#475569" stroke-width="1"/>
  </g>
</svg>
