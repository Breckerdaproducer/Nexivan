<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" width="80" height="100">
  <defs>
    <filter id="pinShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>

    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="85%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="chromeRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <radialGradient id="pinCore" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </radialGradient>
  </defs>

  <g filter="url(#pinShadow)">
    <!-- 3D Pin Teardrop Body -->
    <path d="M 40 96 C 36 78 12 56 12 36 C 12 20 24 8 40 8 C 56 8 68 20 68 36 C 68 56 44 78 40 96 Z" fill="url(#pinGrad)" stroke="#065f46" stroke-width="1.5"/>

    <!-- Outer Chrome Ring -->
    <circle cx="40" cy="36" r="22" fill="url(#chromeRing)" stroke="#a7f3d0" stroke-width="1"/>

    <!-- Inner Core Disc -->
    <circle cx="40" cy="36" r="18" fill="url(#pinCore)" stroke="#10b981" stroke-width="1.2"/>

    <!-- Delivery Home / Residence Building Icon -->
    <!-- Roof -->
    <polygon points="40,24 28,33 31,33 31,44 49,44 49,33 52,33" fill="#047857"/>
    <polygon points="40,23 27,33 30,33 40,25 50,33 53,33" fill="#10b981"/>
    <!-- Chimney -->
    <rect x="44" y="24" width="3" height="5" fill="#047857"/>
    <!-- Door -->
    <rect x="37" y="36" width="6" height="8" rx="0.5" fill="#ffffff"/>
    <circle cx="41.5" cy="40" r="0.6" fill="#047857"/>
    <!-- Window -->
    <rect x="33" y="35" width="3" height="3" fill="#ffffff"/>
  </g>
</svg>
